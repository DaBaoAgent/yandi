<script>
// ================= 001 波斯湾伊甸园 全片渲染页（中东色板 + 通用引擎 + 题材专属） =================
const W=1920,H=1080;
const cv=document.getElementById('cv'),ctx=cv.getContext('2d');
const SB=window.SB;
const COL={bg:'#0E1518',bgA:'#162125',gold:'#E8B84B',goldD:'#9A7524',copper:'#B87333',copperD:'#6E4220',
 teal:'#4E8B8B',tealD:'#1F4040',fish:'#7FA8C9',fishD:'#36577A',sand:'#D9B382',terracotta:'#C96B3D',
 cream:'#F3EAD3',red:'#D9534F',redD:'#8E2F2C',white:'#FFFFFF',grey:'#7A8288',ink:'#0A0F11'};

// ---------- 资产（001 波斯湾素材包 v1，1254正方形RGBA） ----------
const AB='D:/@kaifa/yandi/output/001_波斯湾伊甸园_口播稿+配音/波斯湾伊甸园故事常用素材_透明PNG_v1/';
const ASSETS={
 'oannes':AB+'人物/欧安涅斯.png','priest':AB+'人物/苏美尔祭司雕像.png','linguist':AB+'人物/语言学家.png',
 'ross':AB+'人物/罗斯考古学家.png','enki':AB+'人物/恩基.png','farmer':AB+'人物/苏美尔农夫.png',
 'boat':AB+'道具/古航海船.png','plow':AB+'道具/苏美尔木犁.png','seedbasket':AB+'道具/播种篮.png',
 'ziggurat':AB+'道具/金字形神塔.png','kinglist':AB+'道具/苏美尔王表石碑.png','ark':AB+'道具/洪水方舟.png',
 'spring':AB+'道具/沙漠泉眼.png','ice':AB+'道具/冰盖.png','kish':AB+'道具/基什山.png',
 'hood':AB+'道具/鱼皮兜帽.png','dna':AB+'道具/DNA双螺旋.png','rivers':AB+'道具/四条大河.png',
};
const BGIMG='D:/@kaifa/yandi/output/001_波斯湾伊甸园_口播稿+配音/背景图_v1/bg01_persian_gulf.png';
const IMGS={};let loaded=0;const need=Object.keys(ASSETS).length+1;
function fileUrl(p){return 'file:///'+p.split('/').map(encodeURIComponent).join('/');}
for(const k in ASSETS){const im=new Image();im.onload=()=>{loaded++;};im.onerror=()=>{loaded++;console.log('MISS',k);};im.src=fileUrl(ASSETS[k]);IMGS[k]=im;}
const bgIm=new Image();bgIm.onload=()=>{loaded++;};bgIm.onerror=()=>{loaded++;};bgIm.src=fileUrl(BGIMG);
function img(k){return (IMGS[k]&&IMGS[k].complete&&IMGS[k].naturalWidth)?IMGS[k]:null;}
function sprite(k,x,y,h,o){o=o||{};const im=img(k);if(!im)return;ctx.save();
  ctx.globalAlpha=o.alpha==null?1:o.alpha;ctx.translate(x,y);if(o.rot)ctx.rotate(o.rot);
  if(o.flip)ctx.scale(-1,1);const s=o.scale||1;ctx.scale(s,s);
  if(o.filter&&ctx.filter!==undefined)ctx.filter=o.filter;
  ctx.imageSmoothingEnabled=false;ctx.drawImage(im,-h/2,-h/2,h,h);ctx.restore();
  QC.fgRects.push([x-h/2*s,y-h/2*s,h*s,h*s]);}

// ---------- QC 仪表 ----------
const QC={moving:new Set(),acts:[],textRects:[],subRect:null,fgRects:[]};
function mv(id){QC.moving.add(id);}
function tRect(x,y,w,h){QC.textRects.push([x,y,w,h]);}
function clamp(v,a,b){return v<a?a:v>b?b:v}
function eob(t){if(t<=0)return 0;const c=1.70158;const x=t-1;return 1+(c+1)*x*x*x+c*x*x}
function eoe(t){if(t<=0)return 0;return t>=1?1:1-Math.pow(2,-10*t)}
function eio(t){if(t<=0)return 0;return t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2}
function rnd(seed){const x=Math.sin(seed*127.1+311.7)*43758.5453;return x-Math.floor(x)}

// ---------- 背景四层 ----------
let theme={r:184,g:115,b:51,a:0.10};
function camAt(t){
  const panX=Math.sin(t*Math.PI/26)*42;
  const panY=Math.sin(t*Math.PI/47+1.2)*14;
  const zoom=1.09+Math.cos(t*Math.PI/19)*0.03;
  return {panX,panY,zoom};
}
function bgBase(t){
  if(bgIm.complete&&bgIm.naturalWidth){
    const ir=bgIm.naturalWidth/bgIm.naturalHeight,rr=W/H;
    let sw,sh,sx,sy;
    if(ir>rr){sh=bgIm.naturalHeight;sw=sh*rr;sx=(bgIm.naturalWidth-sw)/2;sy=0;}
    else{sw=bgIm.naturalWidth;sh=sw/rr;sx=0;sy=(bgIm.naturalHeight-sh)/2;}
    const c=camAt(t),m=(c.zoom-1)/2;
    const ox=clamp(c.panX,-W*m,W*m),oy=clamp(c.panY,-H*m,H*m);
    ctx.save();ctx.translate(W/2+ox,H/2+oy);ctx.scale(c.zoom,c.zoom);ctx.translate(-W/2,-H/2);
    ctx.drawImage(bgIm,sx,sy,sw,sh,0,0,W,H);ctx.restore();
    mv('bg-cam');
  }else{ctx.fillStyle=COL.bg;ctx.fillRect(0,0,W,H);}
}
function bgParticles(t){
  ctx.fillStyle='rgba(255,255,255,0.05)';
  for(let i=0;i<44;i++){const px=(rnd(i)*W+t*(14+rnd(i+7)*26))%W;const py=(rnd(i+3)*H+t*(8+rnd(i+11)*18))%H;
    const s=1+rnd(i+5)*2.4;ctx.fillRect(px,py,s,s);}
  mv('bg-particles');
}
function bgTheme(t){
  const pulse=0.75+0.25*Math.sin(t*0.8);
  ctx.fillStyle='rgba('+theme.r+','+theme.g+','+theme.b+','+(theme.a*pulse).toFixed(3)+')';
  ctx.fillRect(0,0,W,H);
  mv('bg-theme');
}
function bgStage(t,stage){
  for(let L=0;L<2;L++){
    const amp=30+L*20,yb=H*(L===0?0.78:0.87),spd=(L===0?8:18);
    ctx.fillStyle=L===0?'rgba(31,64,64,0.40)':'rgba(10,15,17,0.85)';
    ctx.beginPath();ctx.moveTo(0,H);
    for(let x=0;x<=W;x+=24){const y=yb+Math.sin((x+t*spd)*0.0016+L*2.1)*amp+Math.sin((x+t*spd*0.6)*0.004+L)*amp*0.35;ctx.lineTo(x,y);}
    ctx.lineTo(W,H);ctx.closePath();ctx.fill();
  }
  const sea=stage==='sea';
  const wg=sea?0.6:0.22;
  ctx.strokeStyle='rgba(127,168,201,'+wg+')';ctx.lineWidth=3;
  const nL=sea?7:4;
  for(let i=0;i<nL;i++){const yy=H-190+i*(sea?26:34);ctx.beginPath();
    for(let x=0;x<=W;x+=32){ctx.lineTo(x,yy+Math.sin(x*0.012+t*(sea?3.2+i*0.4:2.2+i*0.5)+i)* (sea?9:6));}ctx.stroke();}
  mv('bg-stage');
}

// ---------- 文字 ----------
function bigText(text,x,y,size,color,outline,rot,scale,align){
  if(typeof text!=='string'){window.__badText=(window.__badText||[]);if(window.__badText.length<10)window.__badText.push(String(text));text=String(text);}
  ctx.save();ctx.translate(x,y);if(rot)ctx.rotate(rot);if(scale)ctx.scale(scale,scale);
  ctx.font='900 '+size+'px "Microsoft YaHei"';ctx.textAlign=align||'center';ctx.textBaseline='middle';
  const tw=ctx.measureText(text).width;
  const ax=align==='left'?0:(align==='right'?-tw/2:0);
  if(outline){ctx.lineWidth=size*0.12;ctx.strokeStyle=outline;ctx.lineJoin='round';ctx.strokeText(text,ax,0);}
  ctx.fillStyle=color;ctx.fillText(text,ax,0);ctx.restore();
  tRect(x-(align==='left'?0:tw/2)-size*0.1,y-size*0.62,tw+size*0.2,size*1.24);
}
// ---------- 字幕（底部条 + 关键词金/蓝高亮） ----------
const ACC_KEYS=['雕像','教皇','鱼皮','四千年前','苏美尔','神','半人半鱼','怪物','波斯湾','欧安涅斯','盖庙','法律','农业','几何',
 '绿洲','迪尔蒙','巴林','幽灵人群','尼安德特','伊甸园','冰盖','海平面','泉眼','温盐环流','新仙女木','洪水','基什山','恩基','方舟',
 '鱼头装','王表','干旱','前文明','高等文明','一百二十米','三十五米','七十八倍','七十米','三百年','六万年前','五万年','四条大河'];
const ACC_KEYS2=['半人半鱼','鱼皮','鱼头装','温盐环流','冰盖','海平面','幽灵人群'];
function subBar(text){
  ctx.save();
  ctx.font='900 64px "Microsoft YaHei"';
  const tw=ctx.measureText(text).width;
  const bx=W/2-tw/2-38,by=H-156,bw=tw+76,bh=100;
  ctx.fillStyle='rgba(0,0,0,0.62)';ctx.fillRect(bx,by,bw,bh);
  ctx.fillStyle=COL.gold;ctx.fillRect(bx,by,7,bh);
  ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.lineWidth=9;ctx.strokeStyle='#000';
  const acc2=ACC_KEYS2.find(k=>text.includes(k));
  const acc=acc2||ACC_KEYS.find(k=>text.includes(k));
  let x=W/2-tw/2;
  for(const chr of text){
    const w=ctx.measureText(chr).width;
    const inAcc=acc&&acc.includes(chr);
    ctx.strokeText(chr,x+w/2,by+bh/2+3);
    ctx.fillStyle=inAcc?(acc2?COL.fish:COL.gold):'#fff';
    ctx.fillText(chr,x+w/2,by+bh/2+3);
    x+=w;
  }
  ctx.restore();
  QC.subRect=[bx,by,bw,bh];tRect(bx,by,bw,bh);
}
function card(x,y,w,h,o){o=o||{};ctx.save();
  if(o.alpha!=null)ctx.globalAlpha=o.alpha;ctx.translate(x,y);if(o.rot)ctx.rotate(o.rot);const s=o.scale||1;ctx.scale(s,s);
  ctx.fillStyle=o.fill||'rgba(255,255,255,0.055)';ctx.beginPath();ctx.roundRect(-w/2,-h/2,w,h,o.r||24);ctx.fill();
  if(o.stroke){ctx.strokeStyle=o.stroke;ctx.lineWidth=o.lw||3;ctx.beginPath();ctx.roundRect(-w/2,-h/2,w,h,o.r||24);ctx.stroke();}
  ctx.restore();
  if(!o.noQC)QC.fgRects.push([x-w/2*s,y-h/2*s,w*s,h*s]);}
function chip(x,y,text,color,t0,t,size){const p=eob(clamp((t-t0)/0.35,0,1));if(p<=0)return;
  ctx.save();ctx.font='900 '+(size||52)+'px "Microsoft YaHei"';const tw=ctx.measureText(text).width;
  card(x,y,tw+56,size+34,{stroke:color,lw:3,scale:p,fill:'rgba(255,255,255,0.07)'});
  bigText(text,x,y,size||52,color,null,0,p);mv('chip-'+text+t0);ctx.restore();}
function glow(x,y,r,color,a){ctx.save();const g=ctx.createRadialGradient(x,y,0,x,y,r);
  g.addColorStop(0,color.replace('A',a.toFixed(3)));g.addColorStop(1,color.replace('A','0'));
  ctx.fillStyle=g;ctx.fillRect(x-r,y-r,r*2,r*2);ctx.restore();}

// ---------- 逆光剪影 ----------
function glowRim(x,y,r,t,col){col=col||'rgba(232,184,75,';
  const pr=r*(1+0.03*Math.sin(t*2.2));
  ctx.save();const g=ctx.createRadialGradient(x,y,pr*0.2,x,y,pr);
  g.addColorStop(0,col+'0.34)');g.addColorStop(1,col+'0)');
  ctx.fillStyle=g;ctx.fillRect(x-pr,y-pr,pr*2,pr*2);ctx.restore();mv('rim'+(x|0));}
function silSprite(k,x,y,h,t,ph,o){o=o||{};glowRim(x,y+h*0.25,h*0.75,t,o.glow);
  sprite(k,x,y+Math.sin(t*1.4+(ph||0))*6,h,Object.assign({filter:'brightness(0.12)',alpha:0.96},o));mv('sil-'+k+ph);}

// ---------- 转场（温和） ----------
function dip(t,cut){const dt=t-cut;if(dt>=0&&dt<0.3){const a=Math.sin(Math.PI*dt/0.3);ctx.fillStyle=COL.bg;ctx.globalAlpha=a;ctx.fillRect(0,0,W,H);ctx.globalAlpha=1;}}
function veil(t,cut,color){const dt=t-cut;if(dt>=0&&dt<0.32){const a=Math.sin(Math.PI*dt/0.32)*0.30;ctx.fillStyle=color;ctx.globalAlpha=a;ctx.fillRect(0,0,W,H);ctx.globalAlpha=1;}}
function softFlash(t,cut,color){const dt=t-cut;if(dt>=0&&dt<0.2){const a=Math.sin(Math.PI*dt/0.2)*0.28;ctx.fillStyle=color;ctx.globalAlpha=a;ctx.fillRect(0,0,W,H);ctx.globalAlpha=1;}}
function softWipe(t,cut,color){const dt=t-cut;if(dt>=0&&dt<0.32){const p=eio(dt/0.32);ctx.fillStyle=color;ctx.globalAlpha=0.5;ctx.fillRect(-140+p*(W+280),0,140,H);ctx.globalAlpha=1;}}
function softIris(t,cut){const dt=t-cut;if(dt>=0&&dt<0.36){const p=eoe(dt/0.36);const r=Math.max(1,1150*p);
  ctx.fillStyle=COL.bg;ctx.beginPath();ctx.rect(0,0,W,H);ctx.arc(W/2,H/2,r,0,7);ctx.fill('evenodd');}}
const TRANS_KINDS=['dip','veil','softFlash','softWipe'];
const TRANS={};let kidx=0;
for(const sc of SB.scenes){if(sc.s<=0)continue;
  const r=TRANS_KINDS[kidx%TRANS_KINDS.length];TRANS[sc.s.toFixed(3)]=[r,COL.copper];kidx++;}

// ---------- 场景 ----------
function sceneByT(t){for(const s of SB.scenes){if(t>=s.s&&t<s.e)return s;}return SB.scenes[SB.scenes.length-1];}
function subAt(t){for(const s of SB.subs){if(t>=s[0]&&t<s[1])return s[2];}return '';}
function fishScaleFX(x,y,t,t0,n){
  for(let i=0;i<n;i++){const p=clamp((t-t0-i*0.08)/0.4,0,1);if(p<=0)continue;
    const a=Math.sin(t*3+i*2)*0.5+0.5;
    ctx.save();ctx.globalAlpha=p*0.7*a;
    const sx=x+(rnd(i)*260-130),sy=y+(rnd(i+9)*220-110);
    ctx.fillStyle=COL.fish;ctx.beginPath();ctx.arc(sx,sy,8,0,7);ctx.fill();
    ctx.restore();mv('scale'+i);}
}

// ============ 钩子 7 镜（样片定稿，原样保留） ============
function scStatuesHook(sc,t,tl){
  const defs=[[430,300,0.15],[960,420,0.95],[1490,300,0.45]];
  for(let i=0;i<3;i++){
    const p=eob(clamp((tl-defs[i][2])/0.4,0,1));if(p<=0)continue;
    const x=defs[i][0],h=defs[i][1];
    const yy=H-130-(H-130-(h/2+420))*p;
    glowRim(x,yy+h*0.25,h*0.7,t,i===1?'rgba(232,184,75,':'rgba(127,168,201,');
    const bob=Math.sin(t*1.3+i*1.7)*6;
    sprite('priest',x,yy+bob,h,{alpha:0.98});
    if(i===1){ctx.fillStyle='rgba(110,66,32,0.5)';ctx.beginPath();
      ctx.ellipse(x,H-128,190,34,0,0,7);ctx.fill();mv('pedestal');}
    mv('statue'+i);
  }
  for(let i=0;i<8;i++){const st=(tl*0.7+i*0.12)%1;
    const sx=260+((i*233)%1400),sy=H-150-st*90;
    ctx.fillStyle='rgba(217,179,130,'+(0.6-st*0.5).toFixed(2)+')';
    ctx.fillRect(sx,sy,5,5);mv('dust'+i);}
  chip(960,150,'出土的雕像',COL.sand,0.05,t,58);
  mv('statues-hook');
}
function scPopeRobe(sc,t,tl){
  glowRim(960,520,340,t,'rgba(232,184,75,');
  const p=eob(clamp(tl/0.45,0,1));
  sprite('priest',960,520+Math.sin(t*1.2)*7,540,{alpha:0.99,scale:p});mv('priest-big');
  for(let i=0;i<3;i++){const a=clamp((tl-0.3-i*0.35)/0.4,0,1);if(a<=0)continue;
    ctx.save();ctx.globalAlpha=a;
    const yx=340+i*180;
    ctx.strokeStyle='rgba(232,184,75,0.7)';ctx.lineWidth=5;
    ctx.beginPath();ctx.moveTo(960,yx);ctx.lineTo(960+Math.sin(t*4+i)*40,yx+14);ctx.stroke();
    ctx.restore();mv('robe-line'+i);}
  chip(560,230,'教皇一样的长袍',COL.gold,0.5,t,58);
  chip(1360,230,'鳞片状披肩',COL.fish,1.1,t,58);
  for(let i=0;i<6;i++){const a=t*0.8+i*1.05,r=440+Math.sin(t*1.2+i)*20;
    const px=960+Math.cos(a)*r,py=520+Math.sin(a)*r*0.6;
    ctx.fillStyle='rgba(232,184,75,0.5)';ctx.beginPath();ctx.arc(px,py,5,0,7);ctx.fill();mv('robe-orbit'+i);}
  mv('pope-robe');
}
function scFishSkin(sc,t,tl){
  const sp=eob(clamp(tl/0.4,0,1));
  glowRim(520,560,260,t,'rgba(127,168,201,');
  sprite('priest',520,560+Math.sin(t*1.2)*6,380,{alpha:0.85,scale:sp});mv('priest-side');
  const hp=eob(clamp((tl-0.2)/0.45,0,1));
  if(hp>0){glow(1360,520,300,'rgba(127,168,201,A)',0.32);
    sprite('hood',1360,520+Math.sin(t*1.6)*9,440,{alpha:0.99,scale:hp,rot:Math.sin(t*1.1)*0.03});
    mv('hood');}
  fishScaleFX(1360,520,t,0.55,10);
  chip(960,180,'却套着鱼皮',COL.fish,0.4,t,72);
  const cp=clamp((tl-0.9)/0.35,0,1);
  if(cp>0){ctx.save();ctx.strokeStyle=COL.terracotta;ctx.lineWidth=12;ctx.lineCap='round';
    ctx.beginPath();ctx.moveTo(300,340);ctx.lineTo(300+440*cp,780);ctx.stroke();ctx.restore();mv('cross-robe');}
  mv('fish-skin');
}
function scSumerTime(sc,t,tl){
  const zp=eob(clamp((tl-0.2)/0.5,0,1));
  if(zp>0)sprite('ziggurat',1280,648,500,{alpha:0.95,scale:zp});mv('ziggurat');
  const fp=eob(clamp((tl-0.5)/0.4,0,1));
  if(fp>0){glowRim(430,600,240,t,'rgba(232,184,75,');
    sprite('farmer',430,600+Math.sin(t*1.5)*7,400,{alpha:0.98,scale:fp});mv('farmer');}
  const p1=eob(clamp(tl/0.4,0,1));
  bigText('四千年前',960,180,120,COL.gold,COL.bg,0,p1);mv('4000');
  chip(960,300,'苏美尔人',COL.teal,0.55,t,66);
  for(let i=0;i<7;i++){const px=240+i*240;const py=900+Math.sin(t*2+i)*8;
    ctx.fillStyle='rgba(217,179,130,0.55)';ctx.fillRect(px,py,12,12);mv('tline'+i);}
  mv('sumer-time');
}
function scCallGod(sc,t,tl){
  glowRim(960,560,330,t,'rgba(232,184,75,');
  const p=eob(clamp(tl/0.4,0,1));
  sprite('priest',960,570+Math.sin(t*1.3)*7,470,{alpha:0.98,scale:p});mv('priest-god');
  const g1=eob(clamp((tl-0.25)/0.45,0,1));
  if(g1>0)bigText('神',960,200,170,COL.gold,COL.bg,Math.sin(t*1.8)*0.03,g1);mv('god-char');
  const ring=clamp((tl-0.3)/1.2,0,1);
  ctx.save();ctx.strokeStyle='rgba(232,184,75,'+(0.5*(1-ring)).toFixed(3)+')';ctx.lineWidth=8;
  ctx.beginPath();arc960(570,140+ring*460);ctx.stroke();ctx.restore();mv('ring');
  if(tl>0.88){
    const qp=eob(clamp((tl-0.88)/0.35,0,1));
    bigText('?',1500,300,150,COL.red,COL.gold,Math.sin(t*4)*0.06,qp);mv('q');
    sprite('linguist',1420,760,280,{alpha:0.95*qp,scale:qp});mv('linguist');
  }
  mv('call-god');
}
function arc960(y,r){ctx.beginPath();ctx.arc(960,y,r,0,7);}
function scHowFrom(sc,t,tl){
  const p=eob(clamp(tl/0.4,0,1));
  bigText('?',960,400,300,COL.red,COL.gold,Math.sin(t*3)*0.05,p);mv('big-q');
  bigText('神是怎么来的',960,680,120,COL.cream,COL.bg,0,eob(clamp((tl-0.35)/0.4,0,1)));mv('how');
  for(let i=0;i<3;i++){const a=t*0.7+i*2.1,r=540+Math.sin(t*1.4+i)*24;
    const bx=960+Math.cos(a)*r,by=380+Math.sin(a)*r*0.18;
    sprite('priest',bx,by,150,{alpha:0.85,rot:Math.sin(t*1.5+i)*0.06});mv('orbit-priest'+i);}
  if(tl>0.97){
    const ap=eob(clamp((tl-0.97)/0.4,0,1));
    ctx.save();ctx.globalAlpha=ap;
    ctx.strokeStyle=COL.fish;ctx.lineWidth=10;ctx.lineCap='round';

    ctx.beginPath();ctx.moveTo(0,-14);ctx.lineTo(10,10);ctx.lineTo(-10,10);ctx.closePath();ctx.fill();ctx.restore();mv('flow'+i);}

    bigText('温盐环流又减弱了',960,180,82,COL.terracotta,COL.bg,0,eob(clamp(tl/0.4,0,1)));mv('amoc-word2');

    bigText('它凭什么减弱？',1360,300,72,COL.red,COL.gold,Math.sin(t*3)*0.04,eob(clamp((tl-1.8)/0.4,0,1)));

// 人群汇聚
function scGather(sc,t,tl){
  const people=['farmer','linguist','ross','priest','farmer','linguist'];
  const n=people.length;
  for(let i=0;i<n;i++){
    const p=clamp((tl-0.2-i*0.32)/0.6,0,1);if(p<=0)continue;

// 炼丹（技术汇聚成球）
function scAlchemy(sc,t,tl){
  const glowp=clamp(tl/2.0,0,1);
  const pr=80+glowp*180*(1+0.05*Math.sin(t*4));
  ctx.save();const g=ctx.createRadialGradient(960,560,20,960,560,pr);
  g.addColorStop(0,'rgba(232,184,75,0.85)');g.addColorStop(0.6,'rgba(201,107,61,0.35)');g.addColorStop(1,'rgba(201,107,61,0)');
  ctx.fillStyle=g;ctx.beginPath();ctx.arc(960,560,pr,0,7);ctx.fill();ctx.restore();mv('crucible');
  // 技术粒子汇入（椭圆轨道，底部避让918）
  const items=['boat','plow','ziggurat','dna','seedbasket','kinglist'];
  for(let i=0;i<items.length;i++){
    const p=clamp((tl-0.2-i*0.3)/2.2,0,1);
    const ang=i*1.05+t*0.4;
    const r=500*(1-p)+40;
    const bx=960+Math.cos(ang)*r, by=560+Math.sin(ang)*r*0.5;
    sprite(items[i],bx,by,130,{alpha:0.92});mv('alch-'+i);
  }

  for(let i=0;i<14;i++){const st=(t*0.8+i*0.07)%1;
    const sx=960+Math.sin(i*3.1)*200,sy=600-st*420;
    ctx.fillStyle='rgba(232,184,75,'+(0.8-st*0.6)+')';ctx.beginPath();ctx.arc(sx,sy,6,0,7);ctx.fill();mv('spark'+i);}

  bigText('像炼丹一样',960,840,68,COL.terracotta,null,0,eob(clamp((tl-0.8)/0.4,0,1)));mv('alch-title');
  mv('alchemy');
}
// 洪水（variant: burst 溃坝 / kish 基什山垮 / born 绿洲变波斯湾）
function scFlood(cfg,sc,t,tl){
  const v=cfg.variant;
  if(v==='burst'){
    sprite('ice',1500,400,420,{alpha:0.95});mv('ice-dam');
    // 冰湖
    ctx.fillStyle='rgba(127,168,201,0.5)';ctx.fillRect(1200,200,720,300);
    const breakp=clamp((tl-0.8)/0.8,0,1);
    // 溃坝水墙
    const wx=1500-breakp*900;
    ctx.fillStyle='rgba(127,168,201,'+(0.7+0.1*Math.sin(t*5))+')';ctx.fillRect(wx,400,1600,460);
    for(let i=0;i<8;i++){ctx.strokeStyle='rgba(243,234,211,0.6)';ctx.lineWidth=5;
      const y=440+i*50;ctx.beginPath();ctx.moveTo(wx,y);ctx.lineTo(wx+1500,y+Math.sin(t*6+i)*14);ctx.stroke();mv('wall'+i);}
    // 崩裂冰块
    for(let i=0;i<10;i++){const p=clamp((tl-0.8-i*0.03)/0.8,0,1);
      const ix=1400-p*(500+((i*97)%500)),iy=300+p*400+Math.sin(i*3)*40;
      ctx.fillStyle='rgba(200,225,240,0.85)';ctx.fillRect(ix,iy,26,26);mv('icefrag'+i);}
    bigText('8200年前 冰湖崩了',960,180,82,COL.fish,COL.bg,0,eob(clamp(tl/0.4,0,1)));mv('burst-title');
  } else if(v==='kish'){
    // 基什山被冲垮
    const cr=clamp((tl-0.6)/1.4,0,1);
    sprite('kish',700,600,500,{alpha:0.97});mv('kish-mt');
    // 裂缝
    ctx.strokeStyle='rgba(217,83,79,'+cr+')';ctx.lineWidth=12;
    ctx.beginPath();ctx.moveTo(700,380);
    for(let i=0;i<5;i++)ctx.lineTo(700+Math.sin(i*2)*60+cr*0,420+i*90);ctx.stroke();mv('crack');
    // 右侧水墙推进
    const wx=1900-cr*900;
    ctx.fillStyle='rgba(127,168,201,0.7)';ctx.fillRect(wx,460,900,520);
    for(let i=0;i<6;i++){ctx.strokeStyle='rgba(243,234,211,0.55)';ctx.lineWidth=5;
      const y=500+i*60;ctx.beginPath();ctx.moveTo(wx,y);ctx.lineTo(wx+900,y+Math.sin(t*6+i)*14);ctx.stroke();mv('kwall'+i);}
    // 碎石
    for(let i=0;i<10;i++){const p=clamp((tl-0.6-i*0.02)/1.2,0,1);
      ctx.fillStyle='rgba(110,66,32,0.9)';const rx=700+Math.sin(i*7)*160+p*300,ry=500-p*0+Math.sin(i*5)*30;
      ctx.fillRect(rx,ry,24,24);mv('rock'+i);}
    bigText('冲垮基什山 海水倒灌',960,180,78,COL.red,COL.bg,0,eob(clamp(tl/0.4,0,1)));mv('kish-title');
  } else { // born 绿洲一夜变波斯湾
    const fill=clamp((tl-0.3)/1.8,0,1);
    // 绿洲（泉眼/河流）先显示
    sprite('spring',960,620,420,{alpha:0.95*(1-fill*0.7)});mv('born-spring');
    // 上涨的海
    const wy=830-fill*370;
    ctx.fillStyle='rgba(127,168,201,'+(0.55+0.05*Math.sin(t*3))+')';ctx.fillRect(0,wy,W,H-wy);
    for(let i=0;i<7;i++){ctx.strokeStyle='rgba(243,234,211,'+(0.5-i*0.05)+')';ctx.lineWidth=4;
      const y=wy+12+i*24;ctx.beginPath();for(let x=0;x<=W;x+=28)ctx.lineTo(x,y+Math.sin(x*0.015+t*(3.4+i*0.3)+i)*10);ctx.stroke();}
    mv('born-sea');
    // 小船漂走
    const dr=clamp(tl/2.2,0,1);
    sprite('boat',1300,wy-45+Math.sin(t*1.4)*8,170,{alpha:0.95});mv('born-boat');
    bigText('绿洲一夜变成波斯湾',960,180,84,COL.fish,COL.bg,0,eob(clamp((tl-0.2)/0.45,0,1)));mv('born-title');
  }
  // 雨/水汽
  for(let i=0;i<12;i++){const st=(t*1.0+i*0.08)%1;
    const rx=100+((i*173)%1700),ry=st*H;
    ctx.fillStyle='rgba(127,168,201,'+(0.5-st*0.3)+')';ctx.fillRect(rx,ry,4,22);mv('rain'+i);}
  mv('flood-'+v);
}
// 洪水后：人神搭伙，孤岛
function scAfterFlood(sc,t,tl){
  const rise=clamp((tl-0.3)/3.5,0,1);

  for(let i=0;i<5;i++){ctx.strokeStyle='rgba(127,168,201,'+(0.55-i*0.07)+')';ctx.lineWidth=4;

  mv('af-sea');
  // 方舟漂在水上（底部避让918）
  sprite('ark',960,wy-50+Math.sin(t*1.3)*10,320,{alpha:0.97});mv('af-ark');

  sprite('priest',840,wy-150,130,{alpha:0.9});mv('af-god');
  sprite('farmer',1080,wy-140,120,{alpha:0.9});mv('af-man');

}

function renderGeneric(cfg,sc,t,tl){
  if(SPECIAL_KINDS[cfg.kind]){SPECIAL_KINDS[cfg.kind](cfg,sc,t,tl);return;}
  if(cfg.kind==='bigword')scBigWord(cfg,sc,t,tl);
  else if(cfg.kind==='center')scCenter(cfg,sc,t,tl);
  else if(cfg.kind==='row3')scRow3(cfg,sc,t,tl);
  else if(cfg.kind==='row3sp')scRow3sp(cfg,sc,t,tl);
  else if(cfg.kind==='duo')scDuo(cfg,sc,t,tl);
  else if(cfg.kind==='timeline')scTimeline(cfg,sc,t,tl);
  else if(cfg.kind==='question')scQuestion2(cfg,sc,t,tl);
}

// ---------- 主渲染 ----------
const SEA_TYPES=['sea120','sea-jump','rise70','burst8200','kish-break','gulf-born','nightsea','after-flood','flood-flee','boat-civ','gulf35'];
const SEG=[[0,184,115,51],[8.6,127,168,201],[28,78,139,139],[78,232,184,75],[115,127,168,201],
 [158,201,107,61],[190,232,184,75],[225,78,139,139],[258,127,168,201]];
function render(t){
  QC.moving.clear();QC.acts=[];QC.textRects=[];QC.subRect=null;QC.fgRects=[];
  ctx.setTransform(1,0,0,1,0,0);
  const sc=sceneByT(t);
  const tl=t-sc.s;
  // 分段主题色
  let s0=SEG[0],s1=SEG[1];
  for(let i=0;i<SEG.length-1;i++){if(t>=SEG[i][0]&&t<SEG[i+1][0]){s0=SEG[i];s1=SEG[i+1];break;}}
  if(t>=SEG[SEG.length-1][0]){s0=s1=SEG[SEG.length-1];}
  const k=s0===s1?1:clamp((t-s0[0])/(s1[0]-s0[0]),0,1);
  theme.r=s0[1]+(s1[1]-s0[1])*k;theme.g=s0[2]+(s1[2]-s0[2])*k;theme.b=s0[3]+(s1[3]-s0[3])*k;theme.a=0.10;
  bgBase(t);bgParticles(t);bgTheme(t);
  bgStage(t,SEA_TYPES.includes(sc.type)?'sea':'a');
  try{
    ctx.save();
    const name=sc.type;
    if(name==='statues-hook')scStatuesHook(sc,t,tl);
    else if(name==='pope-robe')scPopeRobe(sc,t,tl);
    else if(name==='fish-skin')scFishSkin(sc,t,tl);
    else if(name==='sumer-time')scSumerTime(sc,t,tl);
    else if(name==='call-god')scCallGod(sc,t,tl);
    else if(name==='how-from')scHowFrom(sc,t,tl);
    else if(name==='oannes-reveal')scOannesReveal(sc,t,tl);
    else if(name==='endcard')scEndcard(sc,t,tl);
    else{
      let cfg=TYPE_CFG[name];
      if(!cfg && SPECIAL_KINDS[name])cfg={kind:name};
      if(cfg)renderGeneric(cfg,sc,t,tl);
      else window.__miss=(window.__miss||[]),(window.__miss.indexOf(name)<0&&window.__miss.push(name));
    }
    ctx.restore();
  }catch(e){window.__err=(window.__err||[]);if(window.__err.length<20)window.__err.push(t.toFixed(2)+': '+String(e));ctx.restore();}
  for(const kk in TRANS){const c=+kk;const dt=t-c;if(dt<0||dt>0.4)continue;
    const ty=TRANS[kk][0],col=TRANS[kk][1];
    if(ty==='dip')dip(t,c);else if(ty==='veil')veil(t,c,col);else if(ty==='softFlash')softFlash(t,c,col);
    else if(ty==='softWipe')softWipe(t,c,col);else if(ty==='softIris')softIris(t,c);}
  const sub=subAt(t);
  if(sub)subBar(sub);
  ctx.save();ctx.font='500 32px "Microsoft YaHei"';ctx.fillStyle='rgba(255,255,255,0.4)';
  ctx.textAlign='right';ctx.textBaseline='top';ctx.fillText('@徐艾伦',W-44,34);ctx.restore();
  const pr=clamp(t/SB.total,0,1);
  ctx.fillStyle='rgba(255,255,255,0.12)';ctx.fillRect(0,H-6,W,6);
  ctx.fillStyle=COL.gold;ctx.fillRect(0,H-6,W*pr,6);mv('progress');
  if(t>SB.total-0.6){ctx.fillStyle='#000';ctx.globalAlpha=(t-(SB.total-0.6))/0.6;ctx.fillRect(0,0,W,H);ctx.globalAlpha=1;}
  QC.moving.add('watermark');QC.acts.push('scene:'+sc.type);
  if(sc.s>0)QC.acts.push('cut:'+sc.type);
}
window.__ready=function(){return loaded>=need;};
window.renderFrame=function(i){render(i/30);return {t:i/30,moving:[...QC.moving],acts:QC.acts,textRects:QC.textRects,subRect:QC.subRect,fgRects:QC.fgRects};};
render(0);
</script></body></html>
