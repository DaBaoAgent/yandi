const IMGS={};let loaded=0;const need=Object.keys(ASSETS).length;
function fileUrl(p){return 'file:///'+p.split('/').map(encodeURIComponent).join('/');}
for(const k in ASSETS){const im=new Image();im.onload=()=>{loaded++;};im.onerror=()=>{loaded++;};im.src=fileUrl(ASSETS[k]);IMGS[k]=im;}
function img(k){return (IMGS[k]&&IMGS[k].complete&&IMGS[k].naturalWidth)?IMGS[k]:null;}
function sprite(k,x,y,h,o){o=o||{};const im=img(k);if(!im)return;ctx.save();
  ctx.globalAlpha=o.alpha==null?1:o.alpha;ctx.translate(x,y);if(o.rot)ctx.rotate(o.rot);
  if(o.flip)ctx.scale(-1,1);const s=o.scale||1;ctx.scale(s,s);
  ctx.imageSmoothingEnabled=false;ctx.drawImage(im,-h/2,-h/2,h,h);ctx.restore();}

// ---------- QC 仪表 ----------
const QC={moving:new Set(),acts:[],textRects:[]};
function mv(id){QC.moving.add(id);}
function act(id){QC.acts.push(id);}
function tRect(x,y,w,h){QC.textRects.push([x,y,w,h]);}
function clamp(v,a,b){return v<a?a:v>b?b:v}
function eob(t){const c=1.70158;const x=t-1;return 1+(c+1)*x*x*x+c*x*x}
function eoe(t){return t>=1?1:1-Math.pow(2,-10*t)}
function eio(t){return t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2}
function rnd(seed){const x=Math.sin(seed*127.1+311.7)*43758.5453;return x-Math.floor(x)}
let perf=0;

// ---------- 背景四层 ----------
let theme={r:232,g:184,b:75,a:0.10}; // 当前主题色（A暖金→B土褐）
function bgBase(){
  ctx.fillStyle=COL.bg;ctx.fillRect(0,0,W,H);
  const g=ctx.createRadialGradient(W/2,H*0.42,80,W/2,H*0.42,W*0.85);
  g.addColorStop(0,'rgba(22,33,37,1)');g.addColorStop(1,'rgba(14,21,24,1)');
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
}
function bgParticles(t){ // 层2：持续微动氛围
  ctx.fillStyle='rgba(255,255,255,0.05)';
  for(let i=0;i<44;i++){const px=(rnd(i)*W+t*(14+rnd(i+7)*26))%W;const py=(rnd(i+3)*H+t*(8+rnd(i+11)*18))%H;
    const s=1+rnd(i+5)*2.4;ctx.fillRect(px,py,s,s);}
  mv('bg-particles');
}
function bgTheme(t){ // 层3：分段主题氛围
  const pulse=0.75+0.25*Math.sin(t*0.8);
  ctx.fillStyle='rgba('+theme.r+','+theme.g+','+theme.b+','+(theme.a*pulse).toFixed(3)+')';
  ctx.fillRect(0,0,W,H);
  mv('bg-theme');
}
function bgStage(t,stage){ // 层4：动态场景舞台（视差山脊 + 地面）
  const sp=stage==='b'?1:0.55;
  for(let L=0;L<2;L++){
    const amp=40+L*26,yb=H*(L===0?0.78:0.88),spd=(L===0?9:22)*sp;
    ctx.fillStyle=L===0?'rgba(23,59,52,0.55)':'rgba(12,20,23,0.9)';
    ctx.beginPath();ctx.moveTo(0,H);
    for(let x=0;x<=W;x+=24){const y=yb+Math.sin((x+t*spd)*0.0016+L*2.1)*amp+Math.sin((x+t*spd*0.6)*0.004+L)*amp*0.35;ctx.lineTo(x,y);}
    ctx.lineTo(W,H);ctx.closePath();ctx.fill();
  }
  if(stage==='b'){ // 泥土地面（上移避让底部字幕条）
    ctx.fillStyle='rgba(74,46,29,0.5)';ctx.fillRect(0,H-160,W,160);
    ctx.fillStyle='rgba(138,90,59,0.35)';
    for(let i=0;i<26;i++){const px=(rnd(i)*W+t*10)%W;ctx.fillRect(px,H-150+rnd(i+3)*40,26,5);}
  }
  if(stage==='c'){ // 灾变裂地
    ctx.fillStyle='rgba(30,20,20,0.55)';ctx.fillRect(0,H-150,W,150);
    ctx.strokeStyle='rgba(217,83,79,0.4)';ctx.lineWidth=4;
    for(let i=0;i<6;i++){const bx=(rnd(i)*W+t*4)%W;ctx.beginPath();ctx.moveTo(bx,H-150);ctx.lineTo(bx+30*rnd(i+2)-15,H);ctx.stroke();}
  }
  mv('bg-stage');
}

// ---------- 文字 ----------
function bigText(text,x,y,size,color,outline,rot,scale,align){
  ctx.save();ctx.translate(x,y);if(rot)ctx.rotate(rot);if(scale)ctx.scale(scale,scale);
  ctx.font='900 '+size+'px "Microsoft YaHei"';ctx.textAlign=align||'center';ctx.textBaseline='middle';
  const tw=ctx.measureText(text).width;
  const ax=align==='left'?0:(align==='right'?-tw/2:0);
  if(outline){ctx.lineWidth=size*0.12;ctx.strokeStyle=outline;ctx.lineJoin='round';ctx.strokeText(text,ax,0);}
  ctx.fillStyle=color;ctx.fillText(text,ax,0);ctx.restore();
  // 仅登记有效可见文字（低透明度水印不计入文字覆盖指标）
  if(ctx.globalAlpha>=0.3)tRect(x-(align==='left'?0:tw/2)-size*0.1,y-size*0.62,tw+size*0.2,size*1.24);
}
// ---------- 字幕（炎帝样式：底部条 + 关键词高亮）----------
const ACC_KEYS=['女娲','伏羲','共工','母系社会','人文之母','补天','造人','婚姻','笙簧','神话','童话','中国','上帝','普罗米修斯','泥人','赫拉','阿佛洛狄忒','雅典娜','伊西斯','观音','礼乐','神媒','妈妈','大禹','诺亚'];
function subBar(text){
  ctx.save();
  ctx.font='900 64px "Microsoft YaHei"';
  const tw=ctx.measureText(text).width;
  const bx=W/2-tw/2-38,by=H-156,bw=tw+76,bh=100;
  ctx.fillStyle='rgba(0,0,0,0.62)';ctx.fillRect(bx,by,bw,bh);
  ctx.fillStyle=COL.gold;ctx.fillRect(bx,by,7,bh);
  ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.lineWidth=9;ctx.strokeStyle='#000';
  const acc=ACC_KEYS.find(k=>text.includes(k));
  let x=W/2-tw/2;
  for(const chr of text){
    const w=ctx.measureText(chr).width;
    const inAcc=acc&&acc.includes(chr);
    ctx.strokeText(chr,x+w/2,by+bh/2+3);
    ctx.fillStyle=inAcc?COL.gold:'#fff';
    ctx.fillText(chr,x+w/2,by+bh/2+3);
    x+=w;
  }
  ctx.restore();
  tRect(bx,by,bw,bh);
}
function card(x,y,w,h,o){o=o||{};ctx.save();
  if(o.alpha!=null)ctx.globalAlpha=o.alpha;ctx.translate(x,y);if(o.rot)ctx.rotate(o.rot);const s=o.scale||1;ctx.scale(s,s);
  ctx.fillStyle=o.fill||'rgba(255,255,255,0.055)';ctx.beginPath();ctx.roundRect(-w/2,-h/2,w,h,o.r||24);ctx.fill();
  if(o.stroke){ctx.strokeStyle=o.stroke;ctx.lineWidth=o.lw||3;ctx.beginPath();ctx.roundRect(-w/2,-h/2,w,h,o.r||24);ctx.stroke();}
  ctx.restore();}
function chip(x,y,text,color,t0,t,size){const p=eob(clamp((t-t0)/0.35,0,1));if(p<=0)return;
  ctx.save();ctx.font='900 '+(size||52)+'px "Microsoft YaHei"';const tw=ctx.measureText(text).width;
  card(x,y,tw+56,size+34,{stroke:color,lw:3,scale:p,fill:'rgba(255,255,255,0.07)'});
  bigText(text,x,y,size||52,color,null,0,p);mv('chip-'+text+t0);ctx.restore();}

  ctx.restore();mv('sil-god'+ph);}
function silProm(x,y,s,t,ph){ // 普罗米修斯：火炬
  ctx.save();ctx.translate(x,y+Math.sin(t*1.6+ph)*9);ctx.scale(s,s);
  ctx.strokeStyle='#8A5A3B';ctx.lineWidth=13;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(0,90);ctx.lineTo(6,-18);ctx.stroke();
  const f=0.9+0.12*Math.sin(t*9+ph);
  ctx.fillStyle=COL.red;ctx.beginPath();ctx.moveTo(0,-104*f);ctx.quadraticCurveTo(38,-40,28,6);ctx.quadraticCurveTo(14,34,0,34);ctx.quadraticCurveTo(-14,34,-28,6);ctx.quadraticCurveTo(-38,-40,0,-104*f);ctx.fill();
  ctx.fillStyle=COL.gold;ctx.beginPath();ctx.moveTo(0,-58*f);ctx.quadraticCurveTo(20,-24,14,10);ctx.quadraticCurveTo(7,26,0,26);ctx.quadraticCurveTo(-7,26,-14,10);ctx.quadraticCurveTo(-20,-24,0,-58*f);ctx.fill();
  ctx.restore();mv('sil-prom'+ph);}
function emblem(x,y,t){ // 回纹玉璧 emblem（非地图）
  ctx.save();ctx.translate(x,y);const r=110+Math.sin(t*1.3)*5;
  ctx.rotate(t*0.15);
  ctx.strokeStyle=COL.jade;ctx.lineWidth=10;ctx.beginPath();ctx.arc(0,0,r,0,7);ctx.stroke();
  ctx.strokeStyle=COL.gold;ctx.lineWidth=4;ctx.beginPath();ctx.arc(0,0,r*0.68,0,7);ctx.stroke();
  ctx.strokeStyle=COL.jade;ctx.lineWidth=6;
  for(let i=0;i<6;i++){ctx.beginPath();ctx.arc(0,0,r*0.84,i*1.05+t*0.4,i*1.05+0.5+t*0.4);ctx.stroke();}
  ctx.restore();mv('emblem');}
function tailTrail(x,y,h,t){ // 女娲蛇尾流光
  ctx.save();ctx.strokeStyle='rgba(78,158,138,0.5)';ctx.lineWidth=7;ctx.lineCap='round';ctx.setLineDash([16,12]);ctx.lineDashOffset=-t*40;
  ctx.beginPath();for(let k=0;k<=20;k++){const p=k/20;const sx=x+h*0.1+Math.sin(t*2.2+p*5)*16;const sy=y-h*0.1+p*h*0.9;if(k===0)ctx.moveTo(sx,sy);else ctx.lineTo(sx,sy);}
  ctx.stroke();ctx.restore();mv('tail-trail');}
function fairyBook(x,y,t){ // 童话书（加大）
  ctx.save();ctx.translate(x,y);const open=clamp((t-36.4)/0.6,0,1);
  ctx.fillStyle=COL.cream;ctx.beginPath();ctx.roundRect(-160,-110,320,220,12);ctx.fill();
  ctx.strokeStyle=COL.redD;ctx.lineWidth=7;ctx.beginPath();ctx.moveTo(0,-110);ctx.lineTo(0,110);ctx.stroke();
  ctx.fillStyle='rgba(217,83,79,0.85)';
  const pw=130*open;
  ctx.beginPath();ctx.moveTo(-5,-98);ctx.quadraticCurveTo(-5-pw,-106,-5-pw,-74);ctx.lineTo(-5-pw,74);ctx.quadraticCurveTo(-5-pw,106,-5,98);ctx.closePath();ctx.fill();
  ctx.beginPath();ctx.moveTo(5,-98);ctx.quadraticCurveTo(5+pw,-106,5+pw,-74);ctx.lineTo(5+pw,74);ctx.quadraticCurveTo(5+pw,106,5,98);ctx.closePath();ctx.fill();
  ctx.fillStyle=COL.gold;for(let i=0;i<3;i++){ctx.beginPath();ctx.arc(-90,-48+i*44,6+Math.sin(t*3+i)*1.8,0,7);ctx.fill();ctx.beginPath();ctx.arc(90,-48+i*44,6+Math.sin(t*3+i+1)*1.8,0,7);ctx.fill();}
  ctx.restore();mv('fairy-book');}

function drawIcon(name,x,y,s,t){const f=ICONS[name];if(f){f(x,y,s);mv('ic-'+name);}else{sprite(name,x,y,s*100||100);}}
function satIcon(ic,x,y,s){if(ICONS[ic])drawIcon(ic,x,y,s);else if(img(ic))sprite(ic,x,y,s*100);}
function dip(t,cut){const dt=t-cut;if(dt>=0&&dt<0.3){const a=Math.sin(Math.PI*dt/0.3);ctx.fillStyle=COL.bg;ctx.globalAlpha=a;ctx.fillRect(0,0,W,H);ctx.globalAlpha=1;}}
function veil(t,cut,color){const dt=t-cut;if(dt>=0&&dt<0.32){const a=Math.sin(Math.PI*dt/0.32)*0.30;ctx.fillStyle=color;ctx.globalAlpha=a;ctx.fillRect(0,0,W,H);ctx.globalAlpha=1;}}
function softFlash(t,cut,color){const dt=t-cut;if(dt>=0&&dt<0.2){const a=Math.sin(Math.PI*dt/0.2)*0.28;ctx.fillStyle=color;ctx.globalAlpha=a;ctx.fillRect(0,0,W,H);ctx.globalAlpha=1;}}
function softWipe(t,cut,color){const dt=t-cut;if(dt>=0&&dt<0.32){const p=eio(dt/0.32);ctx.fillStyle=color;ctx.globalAlpha=0.5;ctx.fillRect(-140+p*(W+280),0,140,H);ctx.globalAlpha=1;}}
function softIris(t,cut){const dt=t-cut;if(dt>=0&&dt<0.36){const p=eoe(dt/0.36);const r=Math.max(1,1150*p);
  ctx.fillStyle=COL.bg;ctx.beginPath();ctx.rect(0,0,W,H);ctx.arc(W/2,H/2,r,0,7);ctx.fill('evenodd');}}
const TRANS_KINDS=['dip','veil','softFlash','softWipe','softIris'];
const TRANS={};let kidx=0;
for(const sc of SB.scenes){if(sc.s<=0)continue;
  if(sc.type==='chapter')TRANS[sc.s.toFixed(3)]=['softIris',null];
  else if(sc.type==='ni-mud')TRANS[sc.s.toFixed(3)]=['softIris',null];
  else if(sc.type==='sil'&&sc.variant==='mountain')TRANS[sc.s.toFixed(3)]=['dip',null];
  else if(sc.type==='sil'&&sc.variant==='campfire')TRANS[sc.s.toFixed(3)]=['softFlash',COL.amber];
  else if(sc.type==='endflash')TRANS[sc.s.toFixed(3)]=['dip',null];
  else if(sc.type==='endcard')TRANS[sc.s.toFixed(3)]=['dip',null];
  else{const r=TRANS_KINDS[kidx%TRANS_KINDS.length];TRANS[sc.s.toFixed(3)]=[r,COL.gold];kidx++;}}

const THEMES=[
 [0,232,184,75,0.10],[30,232,150,90,0.10],[89.5,90,130,170,0.12],[158.6,200,120,140,0.10],
 [211.3,235,150,70,0.12],[254.5,78,158,138,0.10],[306.3,150,110,180,0.11],[373.7,232,184,75,0.10],[427.2,232,184,75,0.10]];
function themeFor(t){
  for(let i=0;i<THEMES.length-1;i++){
    const a=THEMES[i],b=THEMES[i+1];
    if(t>=a[0]&&t<b[0]){const k=clamp((t-a[0])/Math.max(0.8,b[0]-a[0]),0,1);
      return {r:a[1]+(b[1]-a[1])*k,g:a[2]+(b[2]-a[2])*k,b:a[3]+(b[3]-a[3])*k,a:a[4]+(b[4]-a[4])*k};}}
  const l=THEMES[THEMES.length-1];return {r:l[1],g:l[2],b:l[3],a:l[4]};
}

  // 转场
  for(const kk in TRANS){const c=+kk;const dt=t-c;if(dt<0||dt>0.4)continue;
