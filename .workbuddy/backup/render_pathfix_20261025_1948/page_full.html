function pickIcon(text){
  const map=[['神农尝百草','草药'],['本草经','书'],['米饭','米饭'],['茶','茶'],['中药','中药'],['毒','草药'],
   ['种地','种地'],['种植','种地'],['五谷','种地'],['农业','种地'],['粮食','种地'],['定居','定居'],['房子','定居'],['村庄','定居'],
   ['针灸','针灸'],['针','针灸'],['砭石','针灸'],['接生','接生'],['生孩子','接生'],['产妇','接生'],
   ['市场','市场'],['买卖','市场'],['交换','换'],['换','换'],['以物换物','换'],['陶器','陶器'],['碗','陶器'],['罐','陶器'],
   ['火','火'],['部落','部落'],['首领','部落'],['华夏','华夏'],['炎黄','华夏'],['打仗','打仗'],['抢','打仗'],['战争','打仗'],
   ['石斧','石斧'],['兔子','兔子'],['老虎','老虎'],['蚩尤','打仗'],['黄帝','黄帝'],['商业','市场'],['考古','市场']];
  for(const [k,v] of map) if(text.includes(k)) return v;
  return null;
}
// ===== generic templates =====
function layoutText(text,maxPer){
  const lines=[];let r=text;
  while(r.length>maxPer){lines.push(r.slice(0,maxPer));r=r.slice(maxPer);}
  if(r)lines.push(r);
  return lines;
}
function fitText(text){
  const n=text.length;
  let maxPer,size,maxLines;
  if(n<=9){maxPer=9;size=130;maxLines=1;}
  else if(n<=18){maxPer=Math.ceil(n/2);size=112;maxLines=2;}
  else if(n<=26){maxPer=Math.ceil(n/2);size=96;maxLines=2;}
  else if(n<=36){maxPer=Math.ceil(n/3);size=82;maxLines=3;}
  else {maxPer=Math.ceil(n/3);size=68;maxLines=3;}
  let lines=layoutText(text,maxPer);
  if(lines.length>maxLines){lines=lines.slice(0,maxLines);lines[maxLines-1]=lines[maxLines-1].slice(0,-1)+'…';}
  return {lines,size};
}
function accentOf(text){
  const keys=['神农氏','炎帝','黄帝','蚩尤','七千年','华夏','中国'];
  for(const k of keys) if(text.includes(k)) return k;
  return null;
}
function tKinetic(sc,t,tl){
  const txt=sc.text;
  const fit=fitText(txt),lines=fit.lines,size=fit.size;
  const acc=accentOf(txt);
  const p=eoe(clamp(tl/0.45,0,1));
  const scl=0.7+0.3*p;
  lines.forEach((ln,i)=>{
    const y=H/2-90+i*(size+24)-(lines.length-1)*(size+24)/2;
    ctx.save();ctx.translate(W/2,y);ctx.scale(scl,scl);
    ctx.font='900 '+size+'px "Microsoft YaHei"';ctx.textAlign='left';ctx.textBaseline='middle';
    let x=-ctx.measureText(ln).width/2;
    for(const chr of ln){
      const w=ctx.measureText(chr).width;
      const inAcc=acc&&acc.includes(chr);
      ctx.lineWidth=size*0.11;ctx.strokeStyle=COL.bg;ctx.lineJoin='round';
      ctx.strokeText(chr,x,0);
      ctx.fillStyle=inAcc?COL.amber:COL.white;
      ctx.fillText(chr,x,0);
      x+=w;
    }
    ctx.restore();
  });
  const ik=pickIcon(txt);
  if(ik&&ICONS[ik]){const bob=Math.sin(t*1.6)*14;ctx.save();ctx.globalAlpha=0.92;ICONS[ik](1700,330+bob,0.85);ctx.restore();}
  if(acc&&acc.length<=3){ctx.save();ctx.globalAlpha=0.045;bigText(acc,W/2,540,420,COL.white,null,0,1);ctx.restore();}
}

  ctx.lineWidth=34;ctx.strokeStyle=COL.amber;ctx.strokeText('?',0,0);ctx.fillStyle=COL.red;ctx.fillText('?',0,0);ctx.restore();
  const lines=fitText(sc.text).lines;
  const size=fitText(sc.text).size;
  lines.forEach((ln,i)=>bigText(ln,1130,460+i*(size+20)-(lines.length-1)*(size+20)/2,size,COL.white,null,0,p));
}

  ctx.save();ctx.translate(W/2,H/2-40);ctx.scale(scl,scl);

}
function tList(sc,t,tl){
  const items=sc.items||[];
  const n=items.length;const step=(sc.e-sc.s-0.5)/Math.max(1,n);
  items.forEach((it,i)=>{
    const ip=eob(clamp((tl-0.3-i*step)/0.4,0,1));
    if(ip<=0)return;
    const y=540;
    const xx=1920/2+(i-(n-1)/2)*330;
    ctx.save();ctx.translate(xx,y);ctx.scale(ip,ip);
    ctx.fillStyle='rgba(255,255,255,0.07)';ctx.beginPath();ctx.roundRect(-140,-78,280,156,24);ctx.fill();
    ctx.strokeStyle=COL.amber;ctx.lineWidth=3;ctx.beginPath();ctx.roundRect(-140,-78,280,156,24);ctx.stroke();
    bigText(it,0,0,n>4?66:80,COL.white,null,0,1);
    ctx.restore();

}

}
function tEnd(sc,t,tl){

// ===== hand scenes (0-32.38) =====
function iconRiceF(x,y,s){ICONS['米饭'](x,y,s)}
function drawHand(sc,t){
  const name=sc.type;const tl=t-sc.s;
  if(name==='food-burst'){
    const labels=['米饭','白菜','萝卜','猪肉'];const icons=[iconRiceF,(x,y,s)=>{},(x,y,s)=>{},(x,y,s)=>{}];
    for(let i=0;i<4;i++){const dl=i*0.32;const p=eob(clamp((t-dl)/0.5,0,1));
      const x=330+i*420,y=430+Math.sin(perf*2+i)*14;
      ctx.save();ctx.globalAlpha=clamp((t-dl)*4,0,1);ctx.translate(x,y);ctx.scale(p,p);
      ctx.fillStyle=i%2?'rgba(226,75,74,0.18)':'rgba(239,159,39,0.15)';ctx.beginPath();ctx.arc(0,0,150,0,7);ctx.fill();
      if(i===0)ICONS['米饭'](0,0,0.9);
      else{ctx.fillStyle=i===1?COL.green:(i===2?'#F09595':'#F5C4B3');
        if(i===1){ctx.beginPath();ctx.ellipse(0,0,80,100,0,0,7);ctx.fill();ctx.fillStyle='#fff';ctx.beginPath();ctx.ellipse(0,-30,26,44,0,0,7);ctx.fill();}
        else if(i===2){ctx.beginPath();ctx.moveTo(0,110);ctx.quadraticCurveTo(-70,20,-52,-40);ctx.quadraticCurveTo(-30,-84,0,-84);ctx.quadraticCurveTo(30,-84,52,-40);ctx.quadraticCurveTo(70,20,0,110);ctx.fill();ctx.strokeStyle='#3B6D11';ctx.lineWidth=10;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(0,-84);ctx.lineTo(0,-130);ctx.stroke();}
        else{ctx.beginPath();ctx.roundRect(-90,-60,180,120,30);ctx.fill();ctx.fillStyle='#D85A30';ctx.beginPath();ctx.roundRect(-90,-60,180,34,30);ctx.fill();}}
      ctx.restore();
      bigText(labels[i],x,650,64,i%2?COL.red:COL.amber,COL.bg,0,p);}
    bigText('你今天中午吃的',960,180,110,COL.white,null,0,1);
  }
  else if(name==='tea-medicine'){
    const p1=eob(clamp(tl/0.5,0,1)),p2=eob(clamp((tl-1.24)/0.5,0,1));
    ctx.save();ctx.translate(620,470);ctx.scale(p1,p1);ICONS['茶'](0,0,1.5);ctx.restore();
    bigText('茶',620,760,90,COL.teal,COL.bg,0,p1);
    ctx.save();ctx.translate(1300,470);ctx.scale(p2,p2);ICONS['中药'](0,0,1.5);ctx.restore();
    bigText('中药',1300,760,90,COL.amber,COL.bg,0,p2);
    bigText('也是他发现的？',960,180,84,COL.white,null,0,1);
  }
  else if(name==='question'){tQ({text:'这些东西最早是谁发现的'},t,tl);}
  else if(name==='not-wildman'){
    bigText('神农架的野人？',560,420,84,COL.grey,null,-0.06,1);
    const p=clamp(tl/0.3,0,1);
    crossOutAt(560,420,1.3,0.35,t);
    bigText('修仙的道士？',1360,420,84,COL.grey,null,0.05,1);
    crossOutAt(1360,420,1.3,0.95,t);
    bigText('都不是——',960,720,100,COL.red,COL.white,0,eob(clamp((tl-1.7)/0.4,0,1)));
  }
  else if(name==='yandi-reveal'){
    const p1=eoe(clamp(tl/0.7,0,1));
    ctx.save();ctx.globalAlpha=p1;ctx.translate(560,560+40*(1-p1));ICONS['部落'](0,0,1.35);ctx.restore();
    const p2=eob(clamp((tl-3.1)/0.45,0,1));
    stampAt(1240,380,0.4+p2*0.9,'炎',-0.08);
    bigText('炎帝',1560,330,150,COL.white,COL.redD,0,p2);
    bigText('= 神农氏',1560,520,80,COL.amber,null,0,p2);
    bigText('距今 7000+ 年',1560,680,56,COL.grey,null,0,p2);
    bigText('部落首领',560,880,72,COL.white,null,0,p1);
  }
  else if(name==='story-card'){
    const p=eoe(clamp(tl/0.4,0,1));
    ctx.save();ctx.translate(960,480);ctx.scale(0.6+p*0.4,p);
    ctx.fillStyle='rgba(226,75,74,0.14)';ctx.beginPath();ctx.roundRect(-640,-260,1280,520,40);ctx.fill();
    ctx.strokeStyle=COL.red;ctx.lineWidth=4;ctx.beginPath();ctx.roundRect(-640,-260,1280,520,40);ctx.stroke();
    bigText('神农尝百草',0,-90,120,COL.white,null,-0.02,1);
    bigText('为了找药 · 亲口试毒',0,80,64,COL.amber,null,0,1);
    ctx.restore();
    bigText('你可能听过这个故事',960,140,64,COL.grey,null,0,1);
  }
  else if(name==='poison-counter'){tCount72(sc,t,tl);}
  else if(name==='myth'){
    const wob=Math.sin(t*9)*0.03;
    ctx.save();ctx.translate(960,440);ctx.rotate(wob);ctx.scale(1.6,1.6);ICONS['茶'](0,0,1);ctx.restore();
    bigText('听着像神话是吧？',960,780,104,COL.white,COL.redD,wob*0.5,1);
  }
  else if(name==='bigger'){
    const p=eoe(clamp(tl/0.45,0,1));
    const scl=0.5+p*0.5+(p>=1?0.02*Math.sin(t*6):0);
    bigText('他要讲的事',960,340,96,COL.white,null,0,p);
    ctx.save();ctx.translate(960,580);ctx.scale(scl,scl);
    bigText('比你想象的',0,0,150,COL.white,null,0,1);
    bigText('大 得 多',0,190,170,COL.red,COL.white,0,1);
    ctx.restore();
  }
  else if(name==='four-things'){
    const items=[['尝百草','茶'],['教种地','种地'],['创医药','针灸'],['建市场','市场']];
    const dls=[0,1.20,2.83,3.91];const ys=[400,720];
    for(let i=0;i<4;i++){const dl=dls[i];const p=eoe(clamp((tl-dl)/0.4,0,1));if(p<=0)continue;
      const fromLeft=i%2===0;
      const posX=fromLeft? (960-380+ (1-p)*-580) : (960+380+(1-p)*580);
      const posY=ys[Math.floor(i/2)];
      ctx.save();ctx.globalAlpha=clamp(p*2,0,1);ctx.translate(posX,posY);
      ctx.fillStyle='rgba(255,255,255,0.06)';ctx.beginPath();ctx.roundRect(-280,-95,560,190,28);ctx.fill();
      ctx.strokeStyle=COL.amber;ctx.lineWidth=3;ctx.beginPath();ctx.roundRect(-280,-95,560,190,28);ctx.stroke();
      ctx.save();ctx.translate(-190,0);ctx.scale(0.62,0.62);ICONS[items[i][1]](0,0,1);ctx.restore();
      bigText(items[i][0],110,10,84,COL.white,null,0,1);
      ctx.restore();}
    bigText('他不光尝百草，他还……',960,210,64,COL.grey,null,0,1);
  }
  else if(name==='one-man-four'){
    const p1=eoe(clamp(tl/0.3,0,1)),p2=eob(clamp((tl-0.25)/0.4,0,1));
    bigText('一个人',560,420,150,COL.white,null,-0.04,p1);
    bigText('干了四件事',1350,420,150,COL.red,COL.white,0.03,p2);
    const icons=['茶','种地','针灸','市场'];
    for(let i=0;i<4;i++){const pp=eob(clamp((tl-0.45+i*0.09)/0.35,0,1));
      ctx.save();ctx.globalAlpha=pp;ctx.translate(560+i*270,760);ctx.scale(pp*0.85,pp*0.85);ICONS[icons[i]](0,0,1);ctx.restore();}
  }
}
function crossOutAt(x,y,s,delay,t){const p=clamp((t-delay)/0.3,0,1);if(p<=0)return;
  ctx.save();ctx.translate(x,y);ctx.scale(s,s);ctx.strokeStyle=COL.red;ctx.lineWidth=16;ctx.lineCap='round';ctx.globalAlpha=0.95;
  const L=110;ctx.beginPath();ctx.moveTo(-L,-L);ctx.lineTo(-L+2*L*p,-L+2*L*p);ctx.stroke();
  if(p>0.6){const q=(p-0.6)/0.4;ctx.beginPath();ctx.moveTo(L,-L);ctx.lineTo(L-2*L*q,-L+2*L*q);ctx.stroke();}
  ctx.restore();}
function stampAt(x,y,s,text,rot){ctx.save();ctx.translate(x,y);ctx.rotate(rot||0);ctx.scale(s,s);
  ctx.fillStyle=COL.redD;ctx.beginPath();ctx.roundRect(-110,-110,220,220,22);ctx.fill();
  ctx.strokeStyle=COL.cream;ctx.lineWidth=8;ctx.beginPath();ctx.roundRect(-92,-92,184,184,14);ctx.stroke();
  ctx.font='900 130px "Microsoft YaHei"';ctx.fillStyle=COL.cream;ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(text,0,6);ctx.restore();}
// ===== transitions (gentle) =====
function dip(t,cut){const dt=t-cut;if(dt>=0&&dt<0.3){const a=Math.sin(Math.PI*dt/0.3);
  ctx.fillStyle=COL.bg;ctx.globalAlpha=a;ctx.fillRect(0,0,W,H);ctx.globalAlpha=1;}}
function veil(t,cut,color){const dt=t-cut;if(dt>=0&&dt<0.32){const a=Math.sin(Math.PI*dt/0.32)*0.30;
  ctx.fillStyle=color;ctx.globalAlpha=a;ctx.fillRect(0,0,W,H);ctx.globalAlpha=1;}}
function softFlash(t,cut,color){const dt=t-cut;if(dt>=0&&dt<0.2){const a=Math.sin(Math.PI*dt/0.2)*0.28;
  ctx.fillStyle=color;ctx.globalAlpha=a;ctx.fillRect(0,0,W,H);ctx.globalAlpha=1;}}
function softWipe(t,cut,color){const dt=t-cut;if(dt>=0&&dt<0.32){const p=eio(dt/0.32);
  ctx.fillStyle=color;ctx.globalAlpha=0.5;ctx.fillRect(-140+p*(W+280),0,140,H);ctx.globalAlpha=1;}}
function softIris(t,cut){const dt=t-cut;if(dt>=0&&dt<0.36){const p=eoe(dt/0.36);const r=Math.max(1,1150*p);
  ctx.fillStyle=COL.bg;ctx.beginPath();ctx.rect(0,0,W,H);ctx.arc(W/2,H/2,r,0,7);ctx.fill('evenodd');}}
// ===== main render =====
const CUTS=SB.scenes.filter(s=>s.s>0).map(s=>s.s);
const TRANS={};
let kidx=0;
for(const sc of SB.scenes){
  if(sc.s<=0)continue;
  if(sc.type==='chapter')TRANS[sc.s.toFixed(3)]=['softIris',null];
  else if(sc.type==='slam')TRANS[sc.s.toFixed(3)]=['push',COL.red];
  else if(sc.type==='q')TRANS[sc.s.toFixed(3)]=['dip',null];
  else if(sc.type==='list')TRANS[sc.s.toFixed(3)]=['veil',COL.teal];
  else if(sc.type==='icon')TRANS[sc.s.toFixed(3)]=['softWipe',COL.red];
  else if(sc.type==='endcard')TRANS[sc.s.toFixed(3)]=['dip',null];
  else{const rot=[['dip',null],['veil',COL.amber],['softWipe',COL.teal]][kidx%3];TRANS[sc.s.toFixed(3)]=rot;kidx++;}
}
const SLAMS=SB.scenes.filter(s=>s.type==='slam'||s.type==='chapter').map(s=>s.s);
function render(t){
  perf=t;
  if(ctx.reset)ctx.reset(); else ctx.setTransform(1,0,0,1,0,0);
  ctx.setTransform(1,0,0,1,0,0);
  let sc=SB.scenes[SB.scenes.length-1];
  for(const s of SB.scenes){if(t>=s.s&&t<s.e){sc=s;break;}}
  const tl=t-sc.s;
  bg(t);
  try{
  ctx.save();
  for(const c of SLAMS){const dt=t-c;if(dt>=0&&dt<0.3){shake(t,c,6);const ss=1+0.04*(1-eoe(dt/0.3));ctx.translate(W/2,H/2);ctx.scale(ss,ss);ctx.translate(-W/2,-H/2);break;}}
  const name=sc.type;
  if(['food-burst','tea-medicine','question','not-wildman','yandi-reveal','story-card','poison-counter','myth','bigger','four-things','one-man-four'].includes(name)){
    drawHand(sc,t);
  } else if(name==='chapter')tChapter(sc,t,tl);
  else if(name==='q')tQ(sc,t,tl);
  else if(name==='slam')tSlam(sc,t,tl);
  else if(name==='icon')tIcon(sc,t,tl);
  else if(name==='list')tList(sc,t,tl);
  else if(name==='endcard')tEnd(sc,t,tl);
  else if(name==='count72')tCount72(sc,t,tl);
  else tKinetic(sc,t,tl);
  ctx.restore();
  }catch(e){window.__err=(window.__err||[]);if(window.__err.length<20)window.__err.push(t.toFixed(2)+': '+String(e));ctx.restore();}
  for(const k in TRANS){const c=+k;const dt=t-c;if(dt<0||dt>0.4)continue;
    const ty=TRANS[k][0],col=TRANS[k][1];
    if(ty==='dip')dip(t,c);
    else if(ty==='veil')veil(t,c,col);
    else if(ty==='softFlash')softFlash(t,c,col);
    else if(ty==='softWipe')softWipe(t,c,col);
    else if(ty==='softIris')softIris(t,c);
    else if(ty==='push')softFlash(t,c,col);
  }
  let sub='';
  for(const s of SB.subs){if(t>=s[0]&&t<s[1]){sub=s[2];break;}}
  if(sub)subBar(sub);
  watermark();
  progress(t);
  if(t>SB.total-0.6){ctx.fillStyle='#000';ctx.globalAlpha=(t-(SB.total-0.6))/0.6;ctx.fillRect(0,0,W,H);ctx.globalAlpha=1;}
}
window.renderFrame=function(i){render(i/30);return true;};
render(0);
</script></body></html>
